<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f2eb"><title>Roomie · 合租生活管家</title>
<style>
:root{--ink:#202923;--muted:#768079;--paper:#f5f2eb;--card:#fffdfa;--line:#dfddd5;--green:#1f6b4b;--lime:#dff56b;--orange:#ff9b70;--red:#b94f32;--shadow:0 14px 40px #263d3010}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:1180px;margin:auto;padding:25px 28px 105px}.top,.head,.between,.actions{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}.logo{background:var(--green);color:white;width:38px;height:38px;border-radius:13px;display:grid;place-items:center}.home-pill{background:#ebe8e0;border:1px solid var(--line);border-radius:30px;padding:9px 14px;font-size:13px;font-weight:700}.hero{margin:30px 0 22px;background:var(--green);color:white;border-radius:28px;padding:30px 34px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:260px;height:260px;border:55px solid #dff56b24;border-radius:50%;right:-70px;top:-90px}.hero small{color:#bfd1c7;text-transform:uppercase;letter-spacing:.1em}.hero h1{font-size:34px;margin:10px 0 7px}.hero p{color:#d3dfd8;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:22px}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.stat small{color:var(--muted)}.stat b{font-size:24px;display:block;margin-top:6px}.tabs{display:flex;gap:8px;overflow:auto;margin:4px 0 18px}.tabs button,.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:10px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}.tabs button.active{background:var(--ink);color:white;border-color:var(--ink)}.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:23px;padding:23px;box-shadow:var(--shadow)}.head{margin-bottom:18px}.head h2{margin:0;font-size:19px}.btn{border:0;border-radius:12px;background:var(--ink);color:white;padding:11px 15px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.btn.green{background:var(--green)}.btn.light{background:#f0eee8;color:var(--ink)}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:17px}.toolbar select{border:1px solid var(--line);background:white;padding:10px 12px;border-radius:11px;font:inherit}.list{display:grid;gap:11px}.entry{display:flex;align-items:center;gap:14px;background:#f7f4ee;border-radius:17px;padding:15px}.ico{width:43px;height:43px;border-radius:13px;background:white;display:grid;place-items:center;font-size:20px;flex:none}.main{flex:1;min-width:0}.main b{font-size:14px}.main small{display:block;color:var(--muted);margin-top:4px;font-size:12px}.money{font-weight:800;text-align:right}.status{display:inline-block;padding:5px 9px;border-radius:99px;font-size:11px;font-weight:800;margin-top:5px;background:#eee}.pending{background:#ffe3d7;color:#a44328}.paid{background:#dceddf;color:#236244}.collect{background:#e1edf5;color:#27647d}.schedule{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.duty{padding:18px;border:1px solid var(--line);border-radius:18px}.duty .date{font-size:12px;color:var(--green);font-weight:800}.duty h3{margin:8px 0 5px}.duty p{font-size:12px;color:var(--muted);margin:0 0 14px}.inventory{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.item{border:1px solid var(--line);border-radius:18px;padding:18px}.item .em{font-size:25px}.item h3{margin:10px 0 4px}.qty{font-size:25px;font-weight:800}.item .actions{margin-top:14px;gap:7px}.item .btn{padding:8px 11px;flex:1}.rule{border-left:4px solid var(--lime);padding:15px 16px;background:#f6f4ed;border-radius:4px 15px 15px 4px}.rule+.rule{margin-top:11px}.rule h3{margin:0 0 6px;font-size:15px}.rule p{margin:0;color:#58635c;font-size:13px;line-height:1.6}.rule footer{margin-top:10px;font-size:11px;color:var(--muted)}.empty{text-align:center;padding:45px;color:var(--muted)}.modal{position:fixed;inset:0;background:#17231c66;backdrop-filter:blur(5px);display:none;place-items:center;padding:18px;z-index:20}.modal.show{display:grid}.sheet{background:var(--card);width:min(470px,100%);max-height:90vh;overflow:auto;border-radius:25px;padding:25px}.sheet h2{margin:0 0 5px}.sheet>p{margin:0 0 20px;color:var(--muted);font-size:13px}.field{margin:0 0 13px}.field label{font-size:11px;font-weight:800;display:block;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:white;font:inherit}.field textarea{min-height:95px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}.modal .actions{justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;z-index:30;top:18px;left:50%;transform:translate(-50%,-80px);background:var(--ink);color:white;border-radius:12px;padding:12px 18px;font-size:13px;transition:.3s}.toast.show{transform:translate(-50%,0)}
@media(max-width:720px){.app{padding:18px 14px 85px}.hero{padding:25px 22px}.hero h1{font-size:27px}.stats{grid-template-columns:1fr 1fr}.schedule,.inventory{grid-template-columns:1fr}.entry{align-items:flex-start}.grid2{grid-template-columns:1fr}.home-pill{display:none}}
.stats{grid-template-columns:repeat(5,1fr)}.stat.clickable{cursor:pointer;transition:.2s}.stat.clickable:hover{transform:translateY(-3px);border-color:var(--green)}.analytics{display:none;background:#eef4ef;border-radius:18px;padding:18px;margin-bottom:18px}.analytics.show{display:grid;grid-template-columns:170px 1fr;gap:24px;align-items:center}.donut{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:auto}.donut:after{content:"";width:92px;height:92px;border-radius:50%;background:#eef4ef}.catrow{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;margin:10px 0;font-size:13px}.dot{width:9px;height:9px;border-radius:50%}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.calhead{text-align:center;font-size:11px;color:var(--muted);padding:5px}.day{min-height:86px;border:1px solid var(--line);border-radius:12px;padding:8px;background:white;font-size:12px}.day b{display:block;margin-bottom:5px}.event{background:#dcecdf;color:var(--green);border-radius:7px;padding:5px;margin-top:4px;font-size:10px}.viewtoggle{display:flex;gap:7px}@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}@media(max-width:720px){.stats{grid-template-columns:1fr 1fr}.analytics.show{grid-template-columns:1fr}.calendar{gap:3px}.day{min-height:66px;padding:5px}.event{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}}
</style></head><body><main class="app">
<header class="top"><div class="brand"><div class="logo">⌂</div>Roomie</div><div class="home-pill">🌿 梧桐公寓 · 302</div></header>
<section class="hero"><small id="date">今天</small><h1><span id="greeting">你好</span>，小满</h1><p>把账算清，把家照顾好，也把边界说清楚。</p></section>
<section class="stats"><div class="stat"><small>我的待支付</small><b id="payStat">¥0</b></div><div class="stat"><small>我的待收款</small><b id="collectStat">¥0</b></div><div class="stat clickable" onclick="showPaidAnalytics()" title="点击查看支出分析"><small>本月已支付 ↗</small><b id="paidStat">¥0</b></div><div class="stat"><small>本周值日</small><b id="dutyStat">0 项</b></div><div class="stat"><small>物品预警</small><b id="lowStat">0 项</b></div></section><section class="card" style="margin-bottom:18px"><div class="head"><h2>🔔 今日提醒</h2><button class="btn light" onclick="toast('提醒已同步给相关室友')">一键提醒</button></div><div id="alerts" class="list"></div></section>
<nav class="tabs"><button class="active" data-tab="bills">💸 费用账单</button><button data-tab="duties">🧹 值日排班</button><button data-tab="items">📦 公共物品</button><button data-tab="rules">📌 室友公约</button></nav>
<section id="bills" class="panel active card"><div class="head"><h2>费用账单</h2><button class="btn green" onclick="openForm('bill')">+ 登记费用</button></div><div id="analytics" class="analytics"><div id="donut" class="donut"></div><div><h3 style="margin:0">本月已结清支出</h3><small style="color:var(--muted)">按费用类型统计个人分摊金额与占比</small><div id="categories"></div></div></div><div class="toolbar"><select id="monthFilter" onchange="renderBills()"></select><select id="statusFilter" onchange="renderBills()"><option value="all">全部状态</option><option>待支付</option><option>待收款</option><option>已结清</option></select></div><div id="billList" class="list"></div></section>
<section id="duties" class="panel card"><div class="head"><h2>值日排班</h2><div class="viewtoggle"><button class="btn light" id="viewBtn" onclick="toggleDutyView()">📅 日历视角</button><button class="btn green" onclick="openForm('duty')">+ 录入排班</button></div></div><div id="dutyList" class="schedule"></div></section>
<section id="items" class="panel card"><div class="head"><h2>公共物品台账</h2><button class="btn green" onclick="openForm('item')">+ 登记物品</button></div><div id="itemList" class="inventory"></div></section>
<section id="rules" class="panel card"><div class="head"><h2>室友公约</h2><button class="btn green" onclick="openForm('rule')">+ 发布新公约</button></div><div class="toolbar"><button class="chip" id="currentRules" onclick="ruleMode='current';renderRules()">当前版本</button><button class="chip" id="historyRules" onclick="ruleMode='history';renderRules()">历史公约</button></div><div id="ruleList"></div></section>
</main><div class="toast" id="toast"></div><div class="modal" id="modal" onclick="if(event.target===this)closeForm()"><div class="sheet"><h2 id="modalTitle"></h2><p id="modalDesc"></p><form id="form" onsubmit="saveForm(event)"><div id="fields"></div><div class="actions"><button type="button" class="btn light" onclick="closeForm()">取消</button><button class="btn green" type="submit">保存</button></div></form></div></div>
<script>
const KEY='roomie-full-v1',today=new Date(),me='小满';let type='',ruleMode='current',dutyView='list';
const seed={bills:[{id:1,title:'8 月电费',amount:252.8,payer:'小满',month:'2026-08',status:'待收款'},{id:2,title:'周末采购',amount:125.4,payer:'阿哲',month:'2026-09',status:'待支付'},{id:3,title:'宽带费',amount:120,payer:'林夕',month:'2026-09',status:'已结清'}],duties:[{id:1,date:'2026-09-13',area:'厨房',person:'小满',note:'台面与地面',done:false},{id:2,date:'2026-09-14',area:'客厅',person:'阿哲',note:'吸尘与整理',done:false}],items:[{id:1,name:'抽纸',emoji:'🧻',qty:2,unit:'提',low:3},{id:2,name:'洗衣液',emoji:'🫧',qty:4,unit:'瓶',low:2},{id:3,name:'垃圾袋',emoji:'🗑️',qty:12,unit:'个',low:5}],rules:[{id:1,title:'安静时间与访客约定',content:'23:00 后调低音量；朋友留宿请提前在群里说明。',version:3,date:'2026-09-05',current:true},{id:2,title:'公共区域使用公约',content:'公共空间用完比来时更干净一点；私人物品不占用公共通道。',version:2,date:'2026-08-20',current:false}]};
let db=JSON.parse(localStorage.getItem(KEY)||'null')||seed;const $=s=>document.querySelector(s),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));renderAll()},fmt=n=>'¥'+Number(n).toFixed(2),id=()=>Date.now();
function toast(t){const x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function renderMonths(){let ms=[...new Set(db.bills.map(x=>x.month))].sort().reverse();let s=$('#monthFilter'),old=s.value;s.innerHTML='<option value="all">全部月份</option>'+ms.map(m=>`<option value="${m}">${m.replace('-',' 年 ')} 月</option>`).join('');if(ms.includes(old))s.value=old}
function showPaidAnalytics(){document.querySelectorAll('.tabs button,.panel').forEach(x=>x.classList.remove('active'));document.querySelector('[data-tab="bills"]').classList.add('active');$('#bills').classList.add('active');$('#analytics').classList.add('show');let month=today.toISOString().slice(0,7),colors=['#1f6b4b','#ff9b70','#86b9c7','#d9b44a','#9a7cc1'],names=['水费','电费','燃气费','网络费','其他'],vals=[0,0,0,0,0];db.bills.filter(x=>x.status==='已结清'&&x.month===month).forEach(x=>{let i=/水/.test(x.title)?0:/电/.test(x.title)?1:/燃气|煤气/.test(x.title)?2:/宽带|网络/.test(x.title)?3:4;vals[i]+=x.amount/(x.people||4)});let total=vals.reduce((a,b)=>a+b,0),p=0,stops=[];vals.forEach((v,i)=>{if(!v)return;let q=v/total*100;stops.push(`${colors[i]} ${p}% ${p+q}%`);p+=q});$('#donut').style.background=total?`conic-gradient(${stops.join(',')})`:'#dfe4df';$('#categories').innerHTML=total?vals.map((v,i)=>v?`<div class="catrow"><i class="dot" style="background:${colors[i]}"></i><span>${names[i]} · ${(v/total*100).toFixed(0)}%</span><b>${fmt(v)}</b></div>`:'').join(''):'<div class="empty">本月暂无已结清费用</div>';$('#monthFilter').value=month;$('#statusFilter').value='已结清';renderBills();$('#bills').scrollIntoView({behavior:'smooth'});toast('已打开本月支出分析')}
function renderBills(){renderMonths();let m=$('#monthFilter').value,st=$('#statusFilter').value,a=db.bills.filter(x=>(m==='all'||x.month===m)&&(st==='all'||x.status===st));$('#billList').innerHTML=a.length?a.map(x=>{let n=x.people||4;return `<div class="entry"><div class="ico">🧾</div><div class="main"><b>${esc(x.title)}</b><small>${x.month} · 支付人：${esc(x.payer)} · ${esc(x.split||'平均分摊')} · ${n} 人参与（人均 ${fmt(x.amount/n)}）</small></div><div class="money">${fmt(x.amount)}<br><button class="status ${x.status==='已结清'?'paid':x.status==='待收款'?'collect':'pending'}" onclick="cycleBill(${x.id})">${x.status} ▾</button></div></div>`}).join(''):'<div class="empty">该筛选条件下暂无账单</div>'}
function cycleBill(i){let x=db.bills.find(x=>x.id===i),a=['待支付','待收款','已结清'];x.status=a[(a.indexOf(x.status)+1)%3];save();toast('账单状态已更新')}
function renderDuties(){let box=$('#dutyList');if(dutyView==='calendar'){let y=today.getFullYear(),m=today.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),html=['日','一','二','三','四','五','六'].map(x=>`<div class="calhead">${x}</div>`).join('');for(let i=0;i<first;i++)html+='<div></div>';for(let d=1;d<=days;d++){let ds=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,es=db.duties.filter(x=>x.date===ds);html+=`<div class="day"><b>${d}</b>${es.map(x=>`<div class="event">${esc(x.area)} · ${esc(x.person)}${x.done?' ✓':''}</div>`).join('')}</div>`}box.className='calendar';box.innerHTML=html;return}box.className='schedule';box.innerHTML=db.duties.length?db.duties.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>`<article class="duty"><div class="date">${x.date}</div><h3>${esc(x.area)} · ${esc(x.note)}</h3><p>值日人：${esc(x.person)}</p><div class="actions"><button class="btn ${x.done?'light':'green'}" onclick="toggleDuty(${x.id})">${x.done?'✓ 已完成':'标记完成'}</button><button class="btn light" onclick="toast('已向${esc(x.person)}发送提醒')">提醒</button><button class="btn light" onclick="toast('调班申请已发到室友群')">申请调班</button></div></article>`).join(''):'<div class="empty">还没有排班，录入第一项吧</div>'}
function toggleDutyView(){dutyView=dutyView==='list'?'calendar':'list';$('#viewBtn').textContent=dutyView==='list'?'📅 日历视角':'☷ 列表视角';renderDuties()}
function toggleDuty(i){let x=db.duties.find(x=>x.id===i);x.done=!x.done;save();toast(x.done?'值日已完成，辛苦啦':'已恢复为待完成')}
function renderItems(){$('#itemList').innerHTML=db.items.map(x=>`<article class="item"><div class="between"><span class="em">${x.emoji}</span><span class="status ${x.qty<=x.low?'pending':'paid'}">${x.qty<=x.low?'库存不足':'库存正常'}</span></div><h3>${esc(x.name)}</h3><div><span class="qty">${x.qty}</span> ${esc(x.unit)}</div><small>低于 ${x.low}${esc(x.unit)}时提醒</small><div class="actions"><button class="btn light" onclick="stock(${x.id},-1)">− 领用</button><button class="btn green" onclick="stock(${x.id},1)">＋ 买入</button></div></article>`).join('')}
function stock(i,n){let x=db.items.find(x=>x.id===i);if(n<0&&x.qty<=0){toast('库存已经为 0');return}x.qty+=n;save();toast(n>0?'已登记买入':'已登记领用')}
function renderRules(){let a=db.rules.filter(x=>ruleMode==='current'?x.current:!x.current);$('#currentRules').style.background=ruleMode==='current'?'var(--lime)':'';$('#historyRules').style.background=ruleMode==='history'?'var(--lime)':'';$('#ruleList').innerHTML=a.length?a.sort((a,b)=>b.version-a.version).map(x=>`<article class="rule"><h3>${esc(x.title)} · V${x.version}</h3><p>${esc(x.content)}</p><footer>发布于 ${x.date}${x.current?' · 当前生效':''} · ${x.acks||0}/4 人已确认</footer>${x.current&&x.acks<4?`<button class="btn green" style="margin-top:10px" onclick="ackRule(${x.id})">确认同意</button>`:''}</article>`).join(''):'<div class="empty">暂无历史公约</div>'}
function ackRule(i){let x=db.rules.find(x=>x.id===i);x.acks=Math.min(4,(x.acks||0)+1);save();toast('已记录你的确认')}
function stats(){let currentMonth=today.toISOString().slice(0,7),p=db.bills.filter(x=>x.status==='待支付').reduce((s,x)=>s+x.amount/(x.people||4),0),c=db.bills.filter(x=>x.status==='待收款').reduce((s,x)=>s+x.amount*((x.people||4)-1)/(x.people||4),0),paid=db.bills.filter(x=>x.status==='已结清'&&x.month===currentMonth).reduce((s,x)=>s+x.amount/(x.people||4),0),du=db.duties.filter(x=>!x.done),lo=db.items.filter(x=>x.qty<=x.low);$('#payStat').textContent=fmt(p);$('#collectStat').textContent=fmt(c);$('#paidStat').textContent=fmt(paid);$('#dutyStat').textContent=du.length+' 项';$('#lowStat').textContent=lo.length+' 项';let alerts=[...lo.map(x=>`<div class="entry"><div class="ico">📦</div><div class="main"><b>${esc(x.name)}库存不足</b><small>仅剩 ${x.qty}${esc(x.unit)}，建议加入采购清单</small></div></div>`),...du.slice(0,1).map(x=>`<div class="entry"><div class="ico">🧹</div><div class="main"><b>${esc(x.person)}有一项值日待完成</b><small>${x.date} · ${esc(x.area)} · ${esc(x.note)}</small></div></div>`)];$('#alerts').innerHTML=alerts.length?alerts.join(''):'<div class="empty">今天没有待处理提醒，家里一切顺利</div>'}
function renderAll(){renderBills();renderDuties();renderItems();renderRules();stats()}
const forms={bill:{title:'登记共同费用',desc:'记录支付人、参与人数和分摊方式，让每笔账有据可查。',html:`<div class="field"><label>费用名称</label><input name="title" required placeholder="例如：燃气费"></div><div class="grid2"><div class="field"><label>总金额</label><input name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>账单月份</label><input name="month" type="month" required></div></div><div class="grid2"><div class="field"><label>实际支付人</label><select name="payer"><option>小满</option><option>阿哲</option><option>林夕</option><option>可可</option></select></div><div class="field"><label>参与人数</label><select name="people"><option value="2">2 人</option><option value="3">3 人</option><option value="4" selected>4 人</option></select></div></div><div class="grid2"><div class="field"><label>分摊方式</label><select name="split"><option>平均分摊</option><option>按使用量分摊</option><option>自定义分摊</option></select></div><div class="field"><label>当前状态</label><select name="status"><option>待支付</option><option>待收款</option><option>已结清</option></select></div></div>`},duty:{title:'录入值日排班',desc:'安排区域、日期和值日人，室友可随后标记完成。',html:`<div class="grid2"><div class="field"><label>值日日期</label><input name="date" type="date" required></div><div class="field"><label>值日人</label><select name="person"><option>小满</option><option>阿哲</option><option>林夕</option><option>可可</option></select></div></div><div class="field"><label>公共区域</label><input name="area" required placeholder="例如：卫生间"></div><div class="field"><label>任务说明</label><input name="note" required placeholder="例如：深度清洁"></div>`},item:{title:'登记公共物品',desc:'设置库存与预警值，登记后可直接买入或领用。',html:`<div class="grid2"><div class="field"><label>物品名称</label><input name="name" required></div><div class="field"><label>图标</label><input name="emoji" value="📦"></div></div><div class="grid2"><div class="field"><label>当前数量</label><input name="qty" type="number" min="0" required></div><div class="field"><label>单位</label><input name="unit" value="件" required></div></div><div class="field"><label>低库存提醒值</label><input name="low" type="number" min="0" required></div>`},rule:{title:'发布新公约',desc:'发布后，当前版本会自动进入历史记录并等待室友确认。',html:`<div class="field"><label>公约标题</label><input name="title" required></div><div class="field"><label>公约内容</label><textarea name="content" required placeholder="把边界和共识写清楚……"></textarea></div>`}};
function openForm(t){type=t;let f=forms[t];$('#modalTitle').textContent=f.title;$('#modalDesc').textContent=f.desc;$('#fields').innerHTML=f.html;$('#modal').classList.add('show');if(t==='bill')document.querySelector('[name=month]').value=today.toISOString().slice(0,7);if(t==='duty')document.querySelector('[name=date]').value=today.toISOString().slice(0,10)}function closeForm(){$('#modal').classList.remove('show')}
function saveForm(e){e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(type==='bill')db.bills.push({...o,id:id(),amount:+o.amount,people:+o.people});if(type==='duty')db.duties.push({...o,id:id(),done:false});if(type==='item')db.items.push({...o,id:id(),qty:+o.qty,low:+o.low});if(type==='rule'){db.rules.forEach(x=>x.current=false);let v=Math.max(0,...db.rules.map(x=>x.version))+1;db.rules.push({...o,id:id(),version:v,date:today.toISOString().slice(0,10),current:true,acks:1})}closeForm();save();toast('已保存并同步到看板')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')});document.addEventListener('keydown',e=>e.key==='Escape'&&closeForm());$('#date').textContent=new Intl.DateTimeFormat('zh-CN',{weekday:'long',month:'long',day:'numeric'}).format(today);let h=today.getHours();$('#greeting').textContent=h<11?'早上好':h<14?'中午好':h<18?'下午好':'晚上好';renderAll();
</script></body></html>
